name: Build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      WINDOWRAIL_ARCHS: arm64 x86_64
      WINDOWRAIL_SIGNING_MODE: adhoc
      WINDOWRAIL_OUTPUT_APP: ${{ github.workspace }}/dist/WindowRail.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version tag and master ancestry
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ["GITHUB_REF_NAME"]
          match = re.fullmatch(r"v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?", tag)
          if not match:
              raise SystemExit("Expected a version tag such as v0.1.0 or v0.1.0-rc.1")
          with open(os.environ["GITHUB_ENV"], "a") as out:
              out.write("WINDOWRAIL_VERSION=" + match.group(1) + "\n")
          PY
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Test
        run: ./tools/test.sh

      - name: Require fixed signing for version releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SIGNED_RELEASE_ENABLED: ${{ vars.WINDOWRAIL_SIGNED_RELEASE }}
        run: |
          if [[ "$SIGNED_RELEASE_ENABLED" != true ]]; then
            echo "Configure the release signing identity before publishing a version."
            exit 1
          fi

      # PR code never receives signing credentials, including same-repository PRs.
      - name: Import fixed signing identity
        if: github.event_name != 'pull_request' && vars.WINDOWRAIL_SIGNED_RELEASE == 'true'
        env:
          WINDOWRAIL_RELEASE_SIGNING_MODE: ${{ vars.WINDOWRAIL_RELEASE_SIGNING_MODE }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: python3 tools/ci-keychain.py import

      - name: Build Universal 2 app
        run: ./build.sh

      - name: Package app and checksum
        run: ./tools/package.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WindowRail-universal2
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing keychain
        if: always()
        run: python3 tools/ci-keychain.py cleanup

  release:
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: WindowRail-universal2
          path: release-assets

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/*.zip release-assets/*.sha256 --clobber
          else
            flags=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" release-assets/*.zip release-assets/*.sha256 \
              --verify-tag --target master --title "WindowRail $GITHUB_REF_NAME" --generate-notes "${flags[@]}"
          fi
